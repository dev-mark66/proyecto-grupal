<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Eventos - Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar glass-nav fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#"><i class="ph ph-database"></i> EventLog System</a>
            <span class="badge bg-primary fs-6" id="counterBadge">0 / 200 Eventos</span>
        </div>
    </nav>

    <div class="container main-content">
        <div class="row g-4">

            <!-- Formulario de Registro -->
            <div class="col-lg-4">
                <div class="glass-card p-4 sticky-top" style="top: 100px;">
                    <h4 class="mb-4 text-primary"><i class="ph ph-plus-circle"></i> Registrar Evento</h4>

                    <form id="eventForm">
                        <div class="mb-3">
                            <label class="form-label text-light small">Nombre del Evento</label>
                            <input type="text" id="eventName" class="form-control bg-dark text-light border-secondary" placeholder="Ej. Reinicio de servidor" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light small">Tipo de Evento</label>
                            <select id="eventType" class="form-select bg-dark text-light border-secondary">
                                <option value="operativo">Operativo (Verde)</option>
                                <option value="error">Error (Rojo)</option>
                                <option value="seguridad">Seguridad (Amarillo)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light small">Prioridad</label>
                            <select id="eventPriority" class="form-select bg-dark text-light border-secondary">
                                <option value="baja">Baja</option>
                                <option value="media">Media</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">
                            <i class="ph ph-check"></i> Registrar con Timestamp
                        </button>
                    </form>

                    <hr class="border-secondary my-4">

                    <button id="btnBackup" class="btn btn-outline-success w-100 py-2">
                        <i class="ph ph-download-simple"></i> Descargar Backup (JSON)
                    </button>
                </div>
            </div>

            <!-- Consola de Eventos -->
            <div class="col-lg-8">
                <div class="glass-card h-100">
                    <div class="card-header border-secondary bg-transparent d-flex justify-content-between align-items-center p-3">
                        <h5 class="mb-0 font-monospace text-muted">/var/log/events.log</h5>
                        <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary w-50" placeholder="Buscar evento...">
                    </div>
                    <div class="card-body p-0">
                        <div id="eventLog" class="log-container p-3">
                            <!-- Aquí se inyectan los eventos -->
                            <div class="text-muted text-center py-5">Cargando datos iniciales (Fetch API)...</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
